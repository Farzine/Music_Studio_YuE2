<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1500" height="1160" fill="#f8fafc"/>
<g font-family="Arial, sans-serif">
<text x="50" y="62" font-size="32" font-weight="700" fill="#0f172a">YuE2 Music Studio · complete local workflow</text>
<text x="50" y="94" font-size="17" fill="#475569">Browser → API and persistent state → GPU worker → playable, reproducible artifacts</text>
<rect x="50" y="125" width="420" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="50" y="125" width="7" height="130" rx="3" fill="#0d9488"/><text x="72" y="157" font-size="20" font-weight="700" fill="#0d9488">1  Discover &amp; choose</text>
<text x="72" y="185" font-size="15" fill="#334155">Hardware scan • VRAM estimates</text>
<text x="72" y="207" font-size="15" fill="#334155">Installed models • Hugging Face browser</text>
<text x="72" y="229" font-size="15" fill="#334155">Separate Model / VAE / GPU controls</text>
<rect x="540" y="125" width="420" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="125" width="7" height="130" rx="3" fill="#2563eb"/><text x="562" y="157" font-size="20" font-weight="700" fill="#2563eb">2  API &amp; shared domain</text>
<text x="562" y="185" font-size="15" fill="#334155">Validate configuration and compatibility</text>
<text x="562" y="207" font-size="15" fill="#334155">Resolve repository → immutable commit</text>
<text x="562" y="229" font-size="15" fill="#334155">Preview storage, files and repair needs</text>
<rect x="1030" y="125" width="420" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="1030" y="125" width="7" height="130" rx="3" fill="#7c3aed"/><text x="1052" y="157" font-size="20" font-weight="700" fill="#7c3aed">3  Download &amp; repair</text>
<text x="1052" y="185" font-size="15" fill="#334155">Measured bytes • speed • ETA</text>
<text x="1052" y="207" font-size="15" fill="#334155">Private staging → checksums → validation</text>
<text x="1052" y="229" font-size="15" fill="#334155">Publish files → register installation</text>
<rect x="50" y="375" width="420" height="150" rx="16" fill="white" stroke="#cbd5e1"/><rect x="50" y="375" width="7" height="150" rx="3" fill="#0d9488"/><text x="72" y="407" font-size="20" font-weight="700" fill="#0d9488">4  Create a generation</text>
<text x="72" y="435" font-size="15" fill="#334155">Original lyrics + musical style</text>
<text x="72" y="457" font-size="15" fill="#334155">Choose mode, seed and duration budget</text>
<text x="72" y="479" font-size="15" fill="#334155">Select model, compatible VAE and GPU</text>
<text x="72" y="501" font-size="15" fill="#334155">Submit a version in a project</text>
<rect x="540" y="375" width="420" height="150" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="375" width="7" height="150" rx="3" fill="#2563eb"/><text x="562" y="407" font-size="20" font-weight="700" fill="#2563eb">5  API admission &amp; queue</text>
<text x="562" y="435" font-size="15" fill="#334155">Validate task resources and token budget</text>
<text x="562" y="457" font-size="15" fill="#334155">Persist immutable generation config</text>
<text x="562" y="479" font-size="15" fill="#334155">Filesystem queue + resource protection</text>
<text x="562" y="501" font-size="15" fill="#334155">Return job ID; stream real status</text>
<rect x="1030" y="375" width="420" height="150" rx="16" fill="white" stroke="#cbd5e1"/><rect x="1030" y="375" width="7" height="150" rx="3" fill="#475569"/><text x="1052" y="407" font-size="20" font-weight="700" fill="#475569">Persistent local storage</text>
<text x="1052" y="435" font-size="15" fill="#334155">Registry • validation reports • downloads</text>
<text x="1052" y="457" font-size="15" fill="#334155">Projects • versions • job manifests</text>
<text x="1052" y="479" font-size="15" fill="#334155">Runtime command journal • settings</text>
<text x="1052" y="501" font-size="15" fill="#334155">Audio • scores • logs</text>
<rect x="50" y="665" width="420" height="165" rx="16" fill="white" stroke="#cbd5e1"/><rect x="50" y="665" width="7" height="165" rx="3" fill="#d97706"/><text x="72" y="697" font-size="20" font-weight="700" fill="#d97706">6  GPU worker &amp; model manager</text>
<text x="72" y="725" font-size="15" fill="#334155">Claim one generation / runtime command</text>
<text x="72" y="747" font-size="15" fill="#334155">Validate files and GPU placement</text>
<text x="72" y="769" font-size="15" fill="#334155">Native PyTorch / vLLM or audio.cpp CLI</text>
<text x="72" y="791" font-size="15" fill="#334155">Plan → acoustic tokens → synthesis</text>
<text x="72" y="813" font-size="15" fill="#334155">VAE decode → postprocess → delivery</text>
<rect x="540" y="665" width="420" height="165" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="665" width="7" height="165" rx="3" fill="#0d9488"/><text x="562" y="697" font-size="20" font-weight="700" fill="#0d9488">7  Listen, inspect &amp; iterate</text>
<text x="562" y="725" font-size="15" fill="#334155">Live stages and events in generation view</text>
<text x="562" y="747" font-size="15" fill="#334155">Play audio • download supported formats</text>
<text x="562" y="769" font-size="15" fill="#334155">Inspect score / ABC when available</text>
<text x="562" y="791" font-size="15" fill="#334155">Edit score • regenerate • compare versions</text>
<text x="562" y="813" font-size="15" fill="#334155">Keep prompt, seed and manifest</text>
<rect x="1030" y="665" width="420" height="165" rx="16" fill="white" stroke="#cbd5e1"/><rect x="1030" y="665" width="7" height="165" rx="3" fill="#dc2626"/><text x="1052" y="697" font-size="20" font-weight="700" fill="#dc2626">GPU lifecycle &amp; safe operations</text>
<text x="1052" y="725" font-size="15" fill="#334155">Switch: wait → unload → release → load</text>
<text x="1052" y="747" font-size="15" fill="#334155">Commit device only after success</text>
<text x="1052" y="769" font-size="15" fill="#334155">Shutdown: settle task → reap CLI → unload</text>
<text x="1052" y="791" font-size="15" fill="#334155">Delete / repair require unused resources</text>
<text x="1052" y="813" font-size="15" fill="#334155">Worker remains runtime authority</text>
