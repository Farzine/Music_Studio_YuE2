<path d="M960 445 H1025" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="968" y="432" font-size="12" fill="#475569">persist</text>
<path d="M750 525 V590 H260 V660" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="425" y="578" font-size="12" fill="#475569">claim / events</text>
<path d="M470 745 H535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="731" font-size="12" fill="#475569">artifacts</text>
<path d="M1240 525 V660" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1250" y="595" font-size="12" fill="#475569">leases + state</text>
<path d="M1030 810 H965" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="976" y="797" font-size="12" fill="#475569">status</text>
<path d="M750 830 V900 H260 V530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="889" font-size="12" fill="#475569">iterate</text>
<rect x="50" y="960" width="1400" height="140" rx="16" fill="#e2e8f0"/>
<text x="76" y="995" font-size="20" font-weight="700" fill="#0f172a">State has one owner</text>
<text x="76" y="1027" font-size="17" fill="#334155">Frontend: form and display state · API: persisted configuration, registry and queue · Worker: residency, devices and inference</text>
<text x="76" y="1061" font-size="17" fill="#334155">Downloaded ≠ validated ≠ inference ready ≠ currently loaded. Hardware recommendations are estimates, not guarantees.</text>
</g></svg>